<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Balón Feliz - Inicio de Sesión</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <div class="contenedor-login">
        <h1>El Balón Feliz</h1>
        <p class="subtitulo">Tienda Deportiva</p>

        <form id="loginForm">
            <div class="campo-grupo">
                <label for="rol">Tipo de Usuario:</label>
                <select id="rol" required>
                    <option value="cliente">Cliente</option>
                    <option value="admin">Administrador</option>
                </select>
            </div>

            <div class="campo-grupo">
                <label for="tipo_doc">Tipo de Documento:</label>
                <select id="tipo_doc" required>
                    <option value="CC">Cédula de Ciudadanía</option>
                    <option value="TI">Tarjeta de Identidad</option>
                    <option value="CE">Cédula de Extranjería</option>
                    <option value="PAS">Pasaporte</option>
                </select>
            </div>

            <div class="campo-grupo">
                <label for="num_doc">Número de Documento:</label>
                <input type="number" id="num_doc" placeholder="Ingrese su documento" required>
            </div>

            <div class="campo-grupo">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" placeholder="Ingrese su contraseña" required>
            </div>

            <button type="submit" class="btn-principal">INGRESAR</button>
        </form>

        <a href="Olvide_contraseña.html" class="enlace">¿Olvidó su contraseña?</a>
    </div>

    <!-- Script simple para redireccionar según el rol seleccionado -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const rol = document.getElementById('rol').value;

            if (rol === 'admin') {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'cliente.html';
            }
        });
    </script>

</body>
</html>
